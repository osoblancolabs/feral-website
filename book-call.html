<!DOCTYPE html>
<html lang="en" translate="no" id="root-html">
<head>
  <meta name="google" content="notranslate">
  <meta http-equiv="content-language" content="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="FERAL | Book your call" data-es="FERAL | Reserva tu llamada">FERAL | Book your call</title>
  <meta name="description" content="Pick a time to talk with the FERAL team." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/FERAL_Logo-8b2aae8b-50e4-473b-b02b-e14a69e61763.png" />

  <!-- Gate: the booking calendar is only reachable after the application
       form qualifies the lead (apply.html?src=book). Direct visits with no
       qualified flag are sent back to the form. -->
  <script>
    try {
      if (sessionStorage.getItem("feral_q") !== "pass") {
        window.location.replace("apply.html?src=book");
      }
    } catch (e) {
      window.location.replace("apply.html?src=book");
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="lang-toggle.css" />
  <link rel="stylesheet" href="book.css" />

  <style>
    /* ——— Locked design-system overrides (2026-08-26). Page-local because
       book.css is shared with /book, which is outside this restyle.
       Flat black paper, hairline var(--line) borders, 2px radius,
       DM Sans 500 display, no glass. ——— */
    .book-body { --text-muted: var(--muted); }
    .book-grain { display: none; }
    .book-header {
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-bottom: 1px solid var(--line);
    }
    .book-eyebrow { font-weight: 500; letter-spacing: 0.24em; color: var(--pearl); }
    .book-section-head h2 {
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .book-section-head p { color: var(--muted); line-height: 1.65; }
    .book-embed {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: none;
      /* #0a0a0a matches the Calendly iframe's background_color param */
      background: #0a0a0a;
    }
    .book-foot { color: var(--dim); border-top: 1px solid var(--line); }
    /* Language pill: system radius + full-contrast labels. Position rules stay
       in book.css (the 2026-08-24 mobile tall-bar fix) — do not set
       top/bottom/left/right here. */
    .lang-switch {
      border-radius: var(--radius);
      border-color: var(--line-strong);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .lang-switch button { color: var(--muted); }
    .lang-switch button.is-active { background: var(--pearl); color: #0a0a0a; }
  </style>

  <!-- ============================================================
       AD PIXEL  —  ads manager: paste base pixel code below.
       This is the QUALIFIED booking page. The optimized conversion
       'feral_book_call' fires here (and only here), so the pixel is
       conditioned on qualified leads only. A stronger
       'feral_booking_confirmed' event fires when Calendly confirms a booking.
         • dataLayer events:  'feral_book_call', 'feral_booking_confirmed' (GTM)
         • DOM events:         'feral:book-call', 'feral:booking-confirmed'

       The Meta 'Lead' conversion is fired in the body script below, for AD
       TRAFFIC ONLY (2026-08-24). Organic applicants reach this page too, and a
       conversion event trains Meta's delivery model whether or not it ever
       bills a campaign — so organic pushes 'feral_book_call_organic' instead,
       which must never be mapped to an ad conversion.
       ============================================================ -->
  <!-- Attribution capture, then the pixel. ORDER MATTERS: attribution.js
       decides the funnel from the path and stashes the ad parameters on first
       touch; pixel.js reads the same path and refuses to load anything at all
       on the organic funnel (/o/...). The <noscript> tracking image was removed
       with the inline block: it cannot be gated from JavaScript, and a no-JS
       visitor cannot complete this funnel anyway. -->
  <script src="assets/attribution.js"></script>
  <script src="assets/pixel.js"></script>
</head>
<body class="book-body">
  <div class="book-grain" aria-hidden="true"></div>

  <header class="header book-header" role="banner">
    <a href="index.html" class="logo" aria-label="FERAL home">
      <img src="assets/feral-logotype-overlay.png" alt="FERAL." width="1075" height="211" />
    </a>
  </header>

  <main id="main" class="book-main">
    <section class="book-section book-booking" id="booking">
      <div class="book-section-head book-booking-head">
        <span class="book-eyebrow"><span class="t-en">You're in</span><span class="t-es">Estás dentro</span></span>
        <h2><span class="t-en">Book your <span class="g">call</span></span><span class="t-es">Reserva tu <span class="g">llamada</span></span></h2>
        <p><span class="t-en">Pick a time that works. We'll review your account and map the path to scale.</span><span class="t-es">Elige un horario. Revisamos tu cuenta y trazamos el plan para escalar.</span></p>
      </div>
      <div class="book-embed">
        <!-- Calendly inline embed, themed to FERAL black/pearl. widget.js is loaded at end of body.
             Emma's calendar since 2026-08-25 (was Kiefer's). ⚠️ The event type's
             "Redirect to an external site" confirmation setting is configured PER
             EVENT on the Calendly account that owns it, so Emma's copy needs it
             pointed at /booked to pass the scheduled time through. Without it the
             listener below still forwards, but /booked shows no time and the
             confirmation fires as post_booking rather than calendly_redirect. -->
        <div class="calendly-inline-widget"
             data-url="https://calendly.com/emm-chenko/feral-model-interview?hide_gdpr_banner=1&background_color=0a0a0a&text_color=f5f5f5&primary_color=b8a9c9"
             style="min-width:320px;height:760px;"></div>
      </div>
    </section>
  </main>

  <footer class="book-foot">&copy; <span id="year"></span> FERAL. <span class="t-en">All rights reserved.</span><span class="t-es">Todos los derechos reservados.</span></footer>

  <script>
    (function () {
      var y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();

      // Only run for a genuinely qualified visitor.
      var isAds = false;
      try {
        if (sessionStorage.getItem("feral_q") !== "pass") return;
        isAds = sessionStorage.getItem("feral_src") === "book";
      } catch (e) { return; }

      // Qualified lead reached the booking page (conditioned conversion). The
      // Meta 'Lead' conversion is for ad traffic only — see the head comment.
      if (isAds && window.fbq) fbq('track', 'Lead');
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: isAds ? "feral_book_call" : "feral_book_call_organic",
        source: isAds ? "qualified_booking_page" : "qualified_booking_page_organic",
      });
      try { document.dispatchEvent(new CustomEvent("feral:book-call", { detail: { source: isAds ? "qualified" : "qualified_organic" } })); } catch (e) {}

      // When the booking is completed, send the invitee to the branded confirmation page.
      // Preferred path: the Calendly event type's "Redirect to an external site" setting
      // (Confirmation page) sends them to /booked WITH the scheduled time in the query
      // string. Safety net: if that redirect isn't configured yet, this listener forwards
      // to /booked after a short delay so they still land on the thank-you page.
      window.addEventListener("message", function (e) {
        if (e && e.data && typeof e.data.event === "string" && e.data.event === "calendly.event_scheduled") {
          setTimeout(function () { window.location.href = "booked.html"; }, 1800);
        }
      });
    })();
  </script>
  <script src="lang-toggle.js" defer></script>
  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
</body>
</html>
